<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520"><rect width="1440" height="520" fill="#0b1423"/><g font-family="Malgun Gothic,sans-serif"><text x="50" y="65" font-size="29" fill="#ecf5ff">ASTRA · 문서에서 답변 검수까지</text><text x="50" y="103" font-size="17" fill="#9fb5cd">기존 파일럿 구조 · 화면은 저장 결과 재생 · 실시간 실행 아님</text><rect x="50" y="190" width="200" height="140" rx="10" fill="#15243a" stroke="#58dbcf"/><text x="68" y="234" font-size="21" fill="#58dbcf">01 문서</text><text x="68" y="282" font-size="13" fill="#d1dfef">223개 · 공개/합성 구분</text><path d="M250 260 H271" stroke="#7692b0" stroke-width="2"/><path d="M265 255 l6 5 -6 5" fill="none" stroke="#7692b0"/><rect x="275" y="190" width="200" height="140" rx="10" fill="#15243a" stroke="#58dbcf"/><text x="293" y="234" font-size="21" fill="#58dbcf">02 청크</text><text x="293" y="282" font-size="13" fill="#d1dfef">3,275개 · 근거 위치</text><path d="M475 260 H496" stroke="#7692b0" stroke-width="2"/><path d="M490 255 l6 5 -6 5" fill="none" stroke="#7692b0"/><rect x="500" y="190" width="200" height="140" rx="10" fill="#15243a" stroke="#aa98f4"/><text x="518" y="234" font-size="21" fill="#aa98f4">03 권한 필터</text><text x="518" y="282" font-size="13" fill="#d1dfef">회사·역할·시나리오</text><path d="M700 260 H721" stroke="#7692b0" stroke-width="2"/><path d="M715 255 l6 5 -6 5" fill="none" stroke="#7692b0"/><rect x="725" y="190" width="200" height="140" rx="10" fill="#15243a" stroke="#aa98f4"/><text x="743" y="234" font-size="21" fill="#aa98f4">04 검색 근거</text><text x="743" y="282" font-size="13" fill="#d1dfef">E5 기반 기존 검색</text><path d="M925 260 H946" stroke="#7692b0" stroke-width="2"/><path d="M940 255 l6 5 -6 5" fill="none" stroke="#7692b0"/><rect x="950" y="190" width="200" height="140" rx="10" fill="#15243a" stroke="#f1c27b"/><text x="968" y="234" font-size="21" fill="#f1c27b">05 생성 답변</text><text x="968" y="282" font-size="13" fill="#d1dfef">295개 · 정상 차단 5개</text><path d="M1150 260 H1171" stroke="#7692b0" stroke-width="2"/><path d="M1165 255 l6 5 -6 5" fill="none" stroke="#7692b0"/><rect x="1175" y="190" width="200" height="140" rx="10" fill="#15243a" stroke="#f1c27b"/><text x="1193" y="234" font-size="21" fill="#f1c27b">06 구절 검수</text><text x="1193" y="282" font-size="13" fill="#d1dfef">초안 · 사람 승인 대기</text><text x="50" y="402" font-size="18" fill="#c6d6e9">공개 화면: L1 문서 메타데이터 167개 · 실제 답변 재생 4개 · L2/L3 본문 미탑재</text><text x="50" y="445" font-size="16" fill="#8ca4bf">문서 연결 시각화는 GraphRAG 추론이 아닙니다. 자동 구절 초안과 사람 승인 결과를 구분합니다.</text></g></svg>