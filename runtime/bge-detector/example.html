<!doctype html>
<meta charset="utf-8">
<title>ASTRA BGE-M3 연결 예제</title>
<style>body{font:16px/1.55 system-ui;max-width:850px;margin:40px auto;padding:0 20px}textarea,input{box-sizing:border-box;width:100%;margin:6px 0 14px;padding:10px}textarea{height:110px}button{padding:10px 18px}mark{background:#ffd5d5}pre{white-space:pre-wrap;background:#f5f6f8;padding:12px}</style>
<h1>ASTRA BGE-M3 환각 탐지 연결 예제</h1>
<label>질문<input id="question" value="예산과 제출 마감은?"></label>
<label>근거<textarea id="context">사업 예산은 부가세 포함 7천만원이다. 제출 마감은 5월 15일이다.</textarea></label>
<label>답변<textarea id="answer">이 사업의 예산은 9억원이며 제출 마감은 7월 30일입니다.</textarea></label>
<button id="run">검사</button>
<h2>표시</h2><div id="view"></div><h2>응답 JSON</h2><pre id="raw"></pre>
<script>
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
run.onclick=async()=>{const body={question:question.value,context:context.value,answer:answer.value};
 const r=await fetch('http://127.0.0.1:18768/detect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();raw.textContent=JSON.stringify(j,null,2);
 let p=0,h='';for(const s of (j.spans||[])){h+=esc(body.answer.slice(p,s.start));h+='<mark title="'+Math.round(s.probability*100)+'%">'+esc(body.answer.slice(s.start,s.end))+'</mark>';p=s.end}h+=esc(body.answer.slice(p));view.innerHTML=h};
</script>
